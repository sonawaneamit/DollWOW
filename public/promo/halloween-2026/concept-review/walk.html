<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DollWOW spider motion study</title><style>*{box-sizing:border-box}body{margin:0;background:#faf8f5;color:#241f1d;font-family:Arial,sans-serif}header{height:92px;padding:24px 36px;border-bottom:1px solid #ded8d1;display:flex;align-items:center;justify-content:space-between}header strong{font-size:20px}button{min-height:44px;border:1px solid #978b80;border-radius:4px;background:transparent;padding:10px 16px;color:inherit;font:inherit;cursor:pointer}#stage{position:relative;height:calc(100vh - 92px);overflow:hidden;background:#faf8f5}.walker{position:absolute;left:0;top:0;width:88px;height:88px;will-change:transform;pointer-events:none}.walker svg{display:block;width:100%;height:100%;overflow:visible}.walker path{stroke-linecap:round;stroke-linejoin:round}.walker .anatomy{filter:drop-shadow(0 3px 2px #0004)}@media(max-width:600px){header{padding:16px;height:80px}header strong{font-size:16px}#stage{height:calc(100vh - 80px)}.walker{width:64px;height:64px}}</style></head><body><header><strong>DOLLWOW · Motion concept</strong><button id="toggle" type="button">Pause spiders</button></header><main id="stage" aria-label="Isolated spider walking and turning demonstration"></main><script src="spider-motion.js"></script></body></html>
