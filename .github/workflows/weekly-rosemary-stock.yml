name: Weekly Rosemary stock reconciliation

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

concurrency:
  group: weekly-rosemary-stock
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The lock contains platform-specific optional image binaries generated on
      # macOS; npm install resolves the Linux runner variant without executing
      # package lifecycle scripts.
      - run: npm install --ignore-scripts --no-audit
      - run: npm run sync:rosemary-stock:weekly
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
