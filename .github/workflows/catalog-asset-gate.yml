name: Catalog asset ownership
on:
  pull_request:
  push:
    branches: [main]
jobs:
  owned-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:option-assets
      - run: npm run check:public-promotion-data
      - run: npx vitest run tests/ownedOptionAssets.test.mjs tests/publicPayload.test.ts tests/ingestOptionAssets.test.mjs tests/localOptionAssetGate.test.mjs tests/dollVueOwnedReferences.test.ts
